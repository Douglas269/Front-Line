<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<title>FrontLine · Trincheiras online</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #0c0f0d; --painel: #131815; --borda: #27332b; --verde: #8fad88; --verdeEsc: #5a7356; --ambar: #d39a45; --ambarEsc: #b37d2e; --texto: #d6e3d1; --mudo: #9fb39a; --verm: #ff8a7a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--texto); font-family: "Courier New", ui-monospace, monospace; }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 480px; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  h1 { font-size: 20px; letter-spacing: 2px; color: var(--ambar); margin: 6px 0 2px; }
  h2 { font-size: 16px; letter-spacing: 1px; color: var(--ambar); margin: 14px 0 6px; }
  .sub { color: var(--mudo); font-size: 13px; line-height: 1.45; }
  .caixa { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .grande { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--ambar); background: #2a2214; color: #ffd28a; font-weight: 700; font-size: 15px; letter-spacing: 1px; margin-top: 10px; }
  .secundario { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--borda); background: var(--painel); font-weight: 700; font-size: 14px; margin-top: 8px; }
  .campo { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--borda); background: #0f1411; font-size: 16px; margin-top: 8px; }
  .codigo { font-size: 38px; letter-spacing: 8px; text-align: center; color: #ffd28a; font-weight: 700; margin: 8px 0; }
  .erro { color: var(--verm); font-size: 13px; min-height: 18px; margin-top: 6px; }
  .topoLinha { display: flex; justify-content: space-between; align-items: center; }
  a.voltar { color: var(--mudo); font-size: 13px; white-space: nowrap; }
  .topoLinha h1 { font-size: 17px; letter-spacing: 1px; }
  .trofeus { font-size: 26px; font-weight: 700; color: #ffd28a; }
  .placar { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; }
  .placar .num { font-size: 22px; color: #ffd28a; padding: 0 8px; }
  .tempo { height: 8px; background: #1b221d; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .tempo div { height: 100%; background: var(--ambarEsc); transition: width .25s linear; }
  .tempo.urgente div { background: #c0392b; }
  .recs { display: flex; gap: 6px; margin-top: 8px; }
  .rec { flex: 1; background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 4px; text-align: center; font-size: 11px; color: var(--mudo); }
  .rec b { display: block; font-size: 15px; color: var(--texto); }
  .esq { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .sold { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #0f1411; border: 1px solid var(--borda); border-radius: 10px; padding: 7px 4px 6px; text-align: center; }
  .sold .ic { font-size: 18px; line-height: 1; }
  .sold .nm { font-weight: 700; font-size: 12px; } .sold .nm small { display: block; font-weight: 400; font-size: 10px; color: var(--ambar); }
  .sold .vida { width: 80%; height: 4px; background: #1b221d; border-radius: 2px; overflow: hidden; } .sold .vida i { display: block; height: 100%; }
  .sold.f-vigia { border-color: #4f6a48; } .sold.f-obras { border-color: #6b5a33; } .sold.f-descanso { border-color: #3c4a5a; }
  .linhaBtns { display: flex; gap: 6px; }
  .opc { flex: 1; padding: 9px 4px; border-radius: 8px; border: 1px solid var(--borda); background: #0f1411; font-weight: 700; font-size: 12px; }
  .opc small { display: block; font-weight: 400; font-size: 10px; color: var(--mudo); }
  .opc.on { border-color: var(--ambar); background: #2a2214; color: #ffd28a; }
  /* preparação: trincheira no topo, cartões e barra do OK no alcance do polegar */
  .barraPrep { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--mudo); } .barraPrep b { flex: 1; color: var(--texto); }
  .prevBox { position: relative; margin-top: 6px; } .prevBox canvas { height: 160px; }
  .prevRot { position: absolute; left: 8px; top: 6px; font-size: 11px; font-weight: 700; color: #ffd28a; background: rgba(0,0,0,.5); padding: 2px 6px; border-radius: 6px; }
  .secTit { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--ambar); margin: 14px 0 6px; } .secTit small { font-weight: 400; letter-spacing: 0; color: var(--mudo); font-size: 11px; }
  .pts { color: #ffd28a; font-size: 13px; }
  .dica { color: var(--mudo); font-size: 11px; margin-top: 5px; line-height: 1.4; }
  .cartoes { display: grid; gap: 6px; } .cartoes.c3 { grid-template-columns: repeat(3, 1fr); } .cartoes.c2 { grid-template-columns: 1fr 1fr; margin-top: 6px; }
  .cartao { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; background: #0f1411; border: 1px solid var(--borda); border-radius: 10px; padding: 8px 5px; font-size: 12px; }
  .cartao .icG { font-size: 22px; line-height: 1.1; } .cartao small { color: var(--mudo); font-size: 10px; line-height: 1.3; }
  .cartao.on { border-color: var(--ambar); background: #2a2214; color: #ffd28a; }
  .cartao.atq small { min-height: 26px; }
  .passos { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .reforcos { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--borda); background: var(--painel); font-weight: 700; font-size: 13px; text-align: left; }
  .reforcos small { display: block; font-weight: 400; font-size: 11px; color: var(--mudo); } .reforcos.aberto { border-style: solid; border-color: #5c4a26; }
  .barraOk { position: sticky; bottom: 0; z-index: 3; display: flex; gap: 10px; align-items: center; margin: 14px -12px 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--borda); }
  .barraOk .relogio { width: 70px; text-align: center; } .barraOk .relogio b { font-size: 20px; color: #ffd28a; }
  .barraOk .grande { margin-top: 0; flex: 1; background: #d39a45; color: #1a1408; border-color: #ffd28a; font-size: 16px; }
  .intelLinha { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
  /* replay em tela cheia */
  body.emReplay { overflow: hidden; }
  .replayTela { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); }
  .abas { display: flex; gap: 6px; margin-top: 8px; }
  .abas button { flex: 1; padding: 8px 4px; border-radius: 10px 10px 0 0; border: 1px solid var(--borda); border-bottom: none; background: var(--painel); font-weight: 700; font-size: 12px; color: var(--mudo); }
  .abas button small { display: block; font-weight: 400; font-size: 10px; } .abas button.on { background: #2a2214; color: #ffd28a; border-color: var(--ambar); }
  .rpCampo { position: relative; flex: 1; min-height: 170px; } .rpCampo canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0 0 8px 8px; }
  .hud { position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; font-size: 11px; font-weight: 700; pointer-events: none; }
  .hud span { background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 6px; } .hud span:last-child { margin-left: auto; }
  .legenda { position: absolute; left: 6px; top: 30px; display: flex; gap: 6px; font-size: 10px; pointer-events: none; }
  .legenda .lg { background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 6px; color: #e0533f; } .legenda .lg.eu { color: #9fd08f; }
  #ticker { min-height: 72px; font-size: 12px; margin-top: 4px; } .replayTela.acabou #ticker { display: none; }
  #ticker div { background: rgba(0,0,0,.65); border-left: 3px solid #9fd08f; padding: 3px 8px; border-radius: 4px; margin-top: 3px; } #ticker div.ruim { border-left-color: #e0533f; }
  .rpControles { display: flex; gap: 6px; margin-top: 8px; }
  button.mini { min-width: 54px; padding: 11px 8px; border-radius: 10px; border: 1px solid var(--ambar); background: #2a2214; color: #ffd28a; font-weight: 700; font-size: 14px; } button.mini.largo { flex: 1; }
  .replayTela.acabou .rpCampo { flex: 0 0 34%; min-height: 150px; }
  .rpFim { overflow-y: auto; max-height: 64vh; padding-top: 4px; }
  .barraDano { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 5px; } .barraDano span { width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barraDano div { flex: 1; height: 10px; background: #1b221d; border-radius: 5px; overflow: hidden; } .barraDano i { display: block; height: 100%; } .barraDano i.meu { background: #7bc96f; } .barraDano i.dele { background: #e0533f; }
  .decidiu { margin: 0; padding-left: 0; list-style: none; font-size: 12px; line-height: 1.45; } .decidiu li { padding: 5px 8px; background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; margin-top: 4px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--borda); }
  .item:last-child { border-bottom: none; }
  .item .txt { flex: 1; font-size: 13px; }
  .item .txt small { display: block; color: var(--mudo); font-size: 11px; }
  .passo { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--borda); background: #0f1411; font-size: 18px; font-weight: 700; }
  .qtd { min-width: 22px; text-align: center; font-weight: 700; color: #ffd28a; }
  .comprar { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--borda); background: #0f1411; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .comprar.on { border-color: var(--ambar); color: #ffd28a; background: #2a2214; }
  .intel { background: #1d1a12; border: 1px solid #5c4a26; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #e8d3a5; margin-top: 8px; line-height: 1.45; }
  canvas { width: 100%; display: block; border-radius: 8px; border: 1px solid var(--borda); background: #1b1510; }
  .rotCampo { font-size: 12px; color: var(--mudo); margin: 10px 0 4px; display: flex; justify-content: space-between; }
  .resultado { text-align: center; font-size: 18px; font-weight: 700; margin-top: 8px; }
  .bom { color: #a9d39f; } .ruim { color: var(--verm); }
  .espera { text-align: center; padding: 24px 0; }
  .espera .icone { font-size: 40px; }
  a.menuRodape { display: block; text-align: center; margin-top: 18px; padding: 8px; }
  .liga .nomeLiga { font-size: 18px; color: #ffd28a; }
  .medalhas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .medalha { font-size: 12px; background: #1d1a12; border: 1px solid #5c4a26; border-radius: 12px; padding: 2px 8px; }
  .euRank { background: #2a2214; border-radius: 6px; padding-left: 6px; }
  .pisca { animation: pisca 1s infinite alternate; } @keyframes pisca { to { opacity: .4; } }
</style>
</head>

<div id="app"><div class="espera"><div class="icone">⚔️</div><div class="sub">Carregando Trincheiras online…</div></div></div>

<script src="assets/js/duelo.js?v=20261114.2010"></script>
