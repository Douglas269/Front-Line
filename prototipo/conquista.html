<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<title>FrontLine · Conquista</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #0c0f0d; --painel: #131815; --borda: #27332b; --ambar: #d39a45; --ambarEsc: #b37d2e; --texto: #d6e3d1; --mudo: #9fb39a; --verm: #ff8a7a; --verde: #8fd17f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--texto); font-family: "Courier New", ui-monospace, monospace; overflow: hidden; }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #topo { padding: 8px 10px 6px; border-bottom: 1px solid var(--borda); }
  #l1 { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  #l1 .esq, #l1 .dir { display: flex; align-items: center; gap: 6px; }
  #bConfig { background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 1px 6px; font-size: 13px; }
  #configConq { position: fixed; inset: 0; background: rgba(5,7,6,.92); display: none; justify-content: center; align-items: flex-start; overflow-y: auto; z-index: 40; }
  .cfgCaixa { width: 100%; max-width: 480px; padding: 14px; }
  .cfgTitulo { display: flex; justify-content: space-between; align-items: center; color: var(--ambar); letter-spacing: 1px; margin-bottom: 8px; }
  .cfgAbas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
  .cfgAbas button { padding: 8px 2px; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel); color: var(--mudo); font-size: 12px; font-weight: 700; }
  .cfgAbas button.on { border-color: var(--ambar); color: #ffd28a; background: #2a2214; }
  .cfgLinha { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; margin-bottom: 6px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); font-size: 13px; }
  .cfgLinha.col { flex-direction: column; align-items: stretch; }
  .cfgLinha small { display: block; color: var(--mudo); font-size: 11px; margin-top: 2px; }
  .cfgTopo { display: flex; justify-content: space-between; }
  .cfgLinha input[type=range] { width: 100%; accent-color: var(--ambar); }
  .cfgOpcao { display: block; width: 100%; text-align: left; padding: 9px 10px; margin-bottom: 6px; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); font-size: 13px; }
  .cfgOpcao small { display: block; color: var(--mudo); font-size: 11px; margin-top: 2px; }
  .cfgOpcao.on { border-color: var(--ambar); background: #2a2214; color: #ffd28a; }
  .cfgGrade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .cfgGrade div { border: 1px solid var(--borda); border-radius: 8px; padding: 6px; text-align: center; background: var(--painel); }
  .cfgGrade small { display: block; color: var(--mudo); font-size: 10px; } .cfgGrade b { color: #ffd28a; font-size: 16px; }
  button.mini.perigo { border-color: #8a2b2b; color: #ff8a7a; background: #2a1212; }
  body.textoGrande .info, body.textoGrande .acao, body.textoGrande .sub, body.textoGrande .lista, body.textoGrande .linha-tropa .txt { font-size: 15px; }
  body.textoGrande .acao small, body.textoGrande .linha-tropa .txt small { font-size: 12.5px; }
  #bSom { background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 1px 6px; font-size: 13px; }
  #bPausa { background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 1px 8px; font-weight: 700; font-size: 13px; }
  #bPausa.on { border-color: var(--ambar); background: #2a2214; color: #ffd28a; }
  #faixaPausa { display: none; position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(42,34,20,.92); border: 1px solid var(--ambar); color: #ffd28a; font-weight: 700; font-size: 12px; pointer-events: none; white-space: nowrap; }
  #bVelMapa { background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 12px; }
  #fase { color: var(--ambar); letter-spacing: 1px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #l1 .esq { min-width: 0; flex: 1; margin-right: 6px; }
  #l1 .dir { flex: none; }
  #bMenu { background: none; border: 1px solid var(--borda); border-radius: 6px; padding: 0 5px; font-size: 13px; }
  a.voltarMenu { display: block; text-align: center; margin-top: 12px; color: var(--mudo); font-size: 13px; }
  #recs { display: flex; gap: 6px; margin-top: 6px; }
  .rec { flex: 1; background: var(--painel); border: 1px solid var(--borda); border-radius: 6px; padding: 3px; text-align: center; font-size: 11px; color: var(--mudo); }
  .rec b { display: block; font-size: 15px; color: var(--texto); }
  .rec.baixo b { color: var(--verm); }
  #mapaBox { position: relative; flex: 1; min-height: 0; }
  #mapa { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #ferramentas { position: absolute; left: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #ferramentas button { width: 52px; padding: 4px 0 3px; border-radius: 8px; border: 1px solid var(--borda); background: rgba(19,24,21,.9); font-size: 17px; line-height: 1.1; }
  #ferramentas small { display: block; font-size: 8.5px; color: var(--mudo); }
  .lista-tropas { display: flex; flex-direction: column; gap: 5px; margin: 6px 0; }
  .linha-tropa { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 8px; background: var(--painel); }
  .linha-tropa.trancada { opacity: .55; }
  .info-i { margin-left: 4px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--borda); background: transparent; color: var(--mudo); font-size: 11px; line-height: 16px; }
  .ficha { margin: -2px 0 2px; padding: 6px 8px; border: 1px dashed var(--borda); border-radius: 8px; background: #0f1411; }
  .ficha .fl { display: grid; grid-template-columns: 112px 1fr 34px; gap: 6px; align-items: center; font-size: 11px; margin: 2px 0; }
  .ficha .fb { height: 6px; background: #1b221d; border-radius: 3px; overflow: hidden; } .ficha .fb i { display: block; height: 100%; background: var(--ambarEsc); }
  .ficha .fl b { text-align: right; }
  .ficha .fp { font-size: 11px; color: var(--texto, #d6e3d1); margin-bottom: 4px; line-height: 1.5; }
  .ficha .fv { font-size: 11px; margin-top: 6px; line-height: 1.5; } .ficha .fv div { color: var(--mudo); }
  .ficha .fm { display: grid; grid-template-columns: 1fr auto 52px; gap: 6px; color: var(--mudo); margin: 2px 0; } .ficha .fm b { text-align: right; }
  .ficha small { color: var(--mudo); font-size: 10px; }
  .pv { margin: 4px 0; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 8px; background: #0f1411; }
  .pv .pvt { font-size: 11px; font-weight: bold; margin-bottom: 3px; }
  .pv .pvl { display: grid; grid-template-columns: 1fr 70px 38px; gap: 6px; align-items: center; font-size: 11px; margin-top: 4px; }
  .pv .pvl .fb { height: 7px; background: #1b221d; border-radius: 3px; overflow: hidden; } .pv .pvl .fb i { display: block; height: 100%; }
  .pv .pvl b { text-align: right; } .pv .pvs { font-size: 10px; color: var(--mudo); }
  .pv .pvg { display: flex; flex-wrap: wrap; gap: 2px; margin: 3px 0 2px; }
  .pv .pvb { width: 7px; height: 20px; background: #1b221d; border: 1px solid rgba(255,255,255,.12); border-radius: 2px; display: flex; align-items: flex-end; overflow: hidden; } .pv .pvb i { display: block; width: 100%; }
  .ficha .fx { font-size: 11px; color: var(--mudo); margin-top: 5px; line-height: 1.55; }
  .linha-tropa .txt { flex: 1; font-size: 13px; min-width: 0; }
  .linha-tropa .txt small { display: block; font-size: 10.5px; color: var(--mudo); margin-top: 1px; }
  button.mini { flex: none; min-width: 56px; padding: 6px 6px; border-radius: 8px; border: 1px solid var(--ambar); background: #2a2214; color: #ffd28a; font-weight: 700; font-size: 12px; }
  button.mini small { display: block; font-weight: 400; font-size: 10px; color: var(--mudo); }
  .capitulo { margin: 14px 0 2px; color: var(--ambar); font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  button.fase .estrelas { float: right; color: #ffd28a; letter-spacing: 2px; }
  .estrelas-grandes { font-size: 34px; color: #ffd28a; letter-spacing: 6px; margin: 4px 0; }
  .campoOn { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--borda); background: #0f1411; color: var(--texto); font-family: inherit; font-size: 16px; margin-top: 10px; box-sizing: border-box; }
  .erroOn { color: var(--verm); font-size: 13px; min-height: 16px; margin-top: 6px; }
  .codigoOn { font-size: 40px; letter-spacing: 8px; text-align: center; color: #ffd28a; font-weight: 700; margin: 10px 0; }
  .pisca { animation: pisca 1s infinite alternate; } @keyframes pisca { to { opacity: .4; } }
  body.online #bPausa, body.online #bVelMapa, body.online #ferramentas button:nth-child(2), body.online #ferramentas button:nth-child(3) { display: none; }
  details.regras { margin-top: 8px; border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; }
  details.regras summary { cursor: pointer; font-weight: 700; color: var(--ambar); }
  #zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #zoom button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--borda); background: rgba(19,24,21,.9); font-size: 18px; font-weight: 700; }
  #aviso { display: none; pointer-events: none; position: absolute; left: 8px; right: 8px; top: 8px; padding: 5px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; text-align: center; background: rgba(19,24,21,.88); border: 1px solid var(--borda); color: var(--mudo); }
  #aviso.alerta { background: rgba(74,23,23,.92); border-color: #8a2b2b; color: #ffd6cf; }
  #painel { border-top: 1px solid var(--borda); padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); min-height: 150px; max-height: 44%; overflow-y: auto; }
  .titulo { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .titulo .dono { font-size: 12px; }
  .info { font-size: 12px; color: var(--mudo); margin: 4px 0 6px; line-height: 1.4; }
  .soldados { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .sd { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(255,255,255,.15); }
  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .acao { padding: 10px 6px; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel); font-weight: 700; font-size: 13px; }
  .acao small { display: block; font-weight: 400; font-size: 10px; color: var(--mudo); }
  .acao.forte { border-color: var(--ambar); background: #2a2214; color: #ffd28a; }
  .seletor { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; }
  .passo { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel); font-size: 18px; font-weight: 700; }
  .linha { display: flex; gap: 6px; }
  .opc { flex: 1; padding: 11px 4px; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel); font-weight: 700; font-size: 12px; }
  .opc small { display: block; font-weight: 400; font-size: 10px; color: var(--mudo); }
  .opc.on { border-color: var(--ambar); background: #2a2214; color: #ffd28a; }
  /* Telas (início, resultado) */
  #tela { position: fixed; inset: 0; background: rgba(5,7,6,.95); display: none; justify-content: center; align-items: flex-start; overflow-y: auto; z-index: 30; }
  #tela .caixa { width: 100%; max-width: 480px; padding: 22px 16px; }
  h2 { color: var(--ambar); letter-spacing: 1px; margin: 4px 0 6px; }
  .sub { color: var(--mudo); font-size: 13px; line-height: 1.5; }
  .grande { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--ambar); background: #2a2214; color: #ffd28a; font-weight: 700; font-size: 15px; letter-spacing: 1px; margin-top: 12px; }
  .lista { font-size: 13px; line-height: 1.6; margin-top: 8px; }
  .grande.secundaria { border-color: var(--borda); background: var(--painel); color: var(--texto); }
  button.fase { display: block; width: 100%; text-align: left; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid var(--ambar); background: #2a2214; color: #ffd28a; font-size: 14px; }
  button.fase small { display: block; color: var(--mudo); font-size: 11px; margin-top: 3px; }
  button.fase.trancada { border-color: var(--borda); background: var(--painel); color: var(--mudo); }
</style>
</head>
<body>
<div id="app">
  <div id="topo">
    <div id="l1"><span class="esq"><button id="bMenu" onclick="voltarAoMenu()" title="Modos de jogo">🏠</button><span id="fase">CONQUISTA</span></span><span class="dir"><button id="bConfig" onclick="abrirConfigConq()" title="Configurações">⚙️</button><button id="bSom" onclick="alternarSom()" title="Som">🔊</button><button id="bPausa" onclick="pausar()" title="Pausar">⏸</button><button id="bVelMapa" onclick="G.velocidade = G.velocidade === 1 ? 2 : 1" title="Velocidade do mapa">1×</button><span id="relogio">00:00</span></span></div>
    <div id="recs">
      <div class="rec" id="rCom">🍞 Comida<b>0</b></div>
      <div class="rec" id="rMun">🔫 Munição<b>0</b></div>
      <div class="rec" id="rMoe">🪙 Moedas<b>0</b></div>
      <div class="rec" id="rProv">🏴 Terra<b>0</b></div>
    </div>
  </div>
  <div id="mapaBox"><canvas id="mapa"></canvas><div id="aviso"></div><div id="ferramentas"><button onclick="G.sel={tipo:'pesquisa'};renderPainel()" title="Pesquisa">🔬<small>Pesquisa</small></button><button onclick="G.sel={tipo:'diplo'};renderPainel()" title="Diplomacia">🤝<small>Diplomacia</small></button><button onclick="G.sel={tipo:'generais'};renderPainel()" title="Generais">🎖<small>Generais</small></button></div><div id="faixaPausa">⏸ PAUSADO · dá para dar ordens</div>
    <div id="zoom"><button onclick="zoomEm(1.3, cvM.getBoundingClientRect().width / 2, cvM.getBoundingClientRect().height / 2)" title="Aproximar">＋</button><button onclick="zoomEm(1 / 1.3, cvM.getBoundingClientRect().width / 2, cvM.getBoundingClientRect().height / 2)" title="Afastar">－</button><button onclick="irParaCapital()" title="Ir para a sua capital">★</button></div></div>
  <div id="painel"></div>
</div>
<div id="tela"><div class="caixa" id="telaCaixa"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/conquista-mapa.js?v=20261114.1939"></script>
<script src="assets/js/conquista-extra.js?v=20261114.1939"></script>
<script src="assets/js/conquista.js?v=20261114.1939"></script>
<script src="assets/js/conquista-online.js?v=20261114.1939"></script>
<script src="assets/js/conquista-config.js?v=20261114.1939"></script>

</body>
</html>
